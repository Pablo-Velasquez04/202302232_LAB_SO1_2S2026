apiVersion: apps/v1
kind: Deployment
metadata: { name: rust-api, namespace: apps }
spec:
  replicas: 1
  selector: { matchLabels: { app: rust-api } }
  template:
    metadata: { labels: { app: rust-api } }
    spec:
      containers:
      - name: rust-api
        image: zot:5000/munk8s/rust-api:v1
        ports: [{ containerPort: 8080 }]
        env:
        - { name: TARGET_URL, value: "http://go-api:8081/report" }
        resources:
          requests: { cpu: 100m, memory: 32Mi }
          limits:   { cpu: 500m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata: { name: rust-api, namespace: apps }
spec:
  selector: { app: rust-api }
  ports: [{ port: 8080, targetPort: 8080 }]
