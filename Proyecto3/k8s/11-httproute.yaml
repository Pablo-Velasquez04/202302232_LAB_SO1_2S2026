apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: grpc-route, namespace: apps }
spec:
  parentRefs: [{ name: munk8s-gateway }]
  rules:
  - matches:
    - path: { type: PathPrefix, value: /grpc-${CARNET} }
    filters:
    - type: URLRewrite
      urlRewrite:
        path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
    backendRefs: [{ name: rust-api, port: 8080 }]
