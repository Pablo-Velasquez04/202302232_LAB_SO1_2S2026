# This rule is not used by the project munk8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over observability.munk8s.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: munk8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: observability-grafanainstance-admin-role
rules:
- apiGroups:
  - observability.munk8s.io
  resources:
  - grafanainstances
  verbs:
  - '*'
- apiGroups:
  - observability.munk8s.io
  resources:
  - grafanainstances/status
  verbs:
  - get
